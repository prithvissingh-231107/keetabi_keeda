body{

margin-top: 0;

.cnt_area {

.cnt_title{

.books_grd{

width: 125px;

.book_crd h3{

.book_crd a:hover {

    var card = "";

  card = card + '<h3>' + name + '</h3>';
    card = card + '<a href="' + url + '" target="_blank">View on Amazon</a>';
    card = card + '</div>';

      return card;
}
